name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The job id "test" is the status check name that control CM-01 requires.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
